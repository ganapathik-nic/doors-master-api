# Include this file from the nginx.conf `http` block.
# Development host mappings:
#   127.0.0.1 doorsadmin.doors.test
#   127.0.0.1 doorsexternal.doors.test
#   127.0.0.1 doorsapi.doors.test
#
# Master API must run with: --spring.profiles.active=multidomain

map $http_upgrade $doors_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream doors_ui_dev {
    server 127.0.0.1:5173;
}

upstream doors_master_api {
    server 127.0.0.1:8052;
}

server {
    listen 80;
    server_name doorsadmin.doors.test;

    location = / {
        return 302 /doors/;
    }

    location /doors/ {
        proxy_pass http://doors_ui_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $doors_connection_upgrade;
    }

    location ~ ^/api/v1/(auth|admin|governance|reports)(/|$) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE admin;
        proxy_pass http://doors_master_api;
    }

    location ~ ^/api/v1/master/(?!gateway(?:/|$)) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE admin;
        proxy_pass http://doors_master_api;
    }

    location /api/ {
        return 403;
    }
}

server {
    listen 80;
    server_name doorsexternal.doors.test;

    location = / {
        return 302 /doors/;
    }

    location /doors/ {
        proxy_pass http://doors_ui_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $doors_connection_upgrade;
    }

    location ~ ^/api/v1/auth(/|$) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE external;
        proxy_pass http://doors_master_api;
    }

    location ~ ^/api/v1/external/(?!execute(?:/|$)) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE external;
        proxy_pass http://doors_master_api;
    }

    location ~ ^/api/v1/(governance/requests|reports)(/|$) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE external;
        proxy_pass http://doors_master_api;
    }

    location /api/ {
        return 403;
    }
}

server {
    listen 80;
    server_name doorsapi.doors.test;

    location = / {
        return 302 /doors-swagger.html;
    }

    location ~ ^/api/v1/master/gateway(/|$) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE api;
        proxy_pass http://doors_master_api;
    }

    location ~ ^/api/v1/external/execute(/|$) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE api;
        proxy_pass http://doors_master_api;
    }

    location ~ ^/(v3/api-docs|swagger|doors-swagger) {
        include conf/doors-proxy-headers.conf;
        proxy_set_header X-DOORS-PLANE api;
        proxy_pass http://doors_master_api;
    }

    location /api/ {
        return 403;
    }
}
