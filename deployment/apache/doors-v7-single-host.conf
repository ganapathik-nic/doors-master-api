# Include inside the existing demoetenders.tn.nic.in:443 VirtualHost.
# Keep these mappings before any broader /api or legacy DOORS proxy rule.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# Client-supplied routing identities must never reach Master API.
RequestHeader unset X-Forwarded-Host
RequestHeader unset X-DOORS-PLANE

ProxyPass        /doorsv7-api/      http://127.0.0.1:8057/ connectiontimeout=60 timeout=1800
ProxyPassReverse /doorsv7-api/      http://127.0.0.1:8057/
ProxyPass        /doorsv7-external/ http://127.0.0.1:8057/ connectiontimeout=60 timeout=1800
ProxyPassReverse /doorsv7-external/ http://127.0.0.1:8057/
ProxyPass        /doorsv7-machine/  http://127.0.0.1:8057/ connectiontimeout=60 timeout=1800
ProxyPassReverse /doorsv7-machine/  http://127.0.0.1:8057/

<Location /doorsv7-api/>
    RequestHeader set X-Forwarded-Host "doorsadmin.doors.test"
</Location>

<Location /doorsv7-external/>
    RequestHeader set X-Forwarded-Host "doorsexternal.doors.test"
</Location>

<Location /doorsv7-machine/>
    RequestHeader set X-Forwarded-Host "doorsapi.doors.test"
</Location>

# The Master API must listen only on 127.0.0.1:8057. PlaneHostResolver
# intentionally ignores forwarded host data arriving from non-loopback peers.
