worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    map $http_upgrade $doors_connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream doors_ui_dev {
        server 127.0.0.1:5173;
    }

    upstream doors_master_api {
        server 127.0.0.1:8052;
    }

    # Redirect every DOORS hostname to HTTPS.
    server {
        listen 80;
        server_name
            doorsadmin.doors.test
            doorsexternal.doors.test
            doorsapi.doors.test;
        return 301 https://$host$request_uri;
    }

    # ================================================================
    # Shared local TLS certificate
    # Copy the generated DOORS certificate/key to these paths first:
    #   C:/nginx/conf/certs/doors-cert.pem
    #   C:/nginx/conf/certs/doors-key.pem
    # ================================================================

    # ADMIN PLANE: DataManager, SecurityAdmin, and Developer interactive portal.
    server {
        listen 443 ssl;
        server_name doorsadmin.doors.test;

        ssl_certificate     C:/nginx/conf/certs/doors-cert.pem;
        ssl_certificate_key C:/nginx/conf/certs/doors-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /doors/;
        }

        location /doors/ {
            proxy_pass https://doors_ui_dev;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $doors_connection_upgrade;
        }

        location ~ ^/api/v1/(auth|admin|governance|reports)(/|$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE admin;
        }

        # DataManager administration surface. Runtime gateway operations remain API-plane-only.
        location ~ ^/api/v1/master/gateway/api-clients(/|$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE admin;
        }

        location ~ ^/api/v1/master/(?!gateway(?:/|$)) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE admin;
        }

        location /api/ {
            default_type application/problem+json;
            return 403 '{"code":"DOORS-PLANE-ROUTE-DENIED","message":"Endpoint is not exposed on the admin plane"}';
        }
    }

    # EXTERNAL PLANE: External and DataViewer portal.
    server {
        listen 443 ssl;
        server_name doorsexternal.doors.test;

        ssl_certificate     C:/nginx/conf/certs/doors-cert.pem;
        ssl_certificate_key C:/nginx/conf/certs/doors-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /doors/;
        }

        location /doors/ {
            proxy_pass https://doors_ui_dev;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $doors_connection_upgrade;
        }

        location ~ ^/api/v1/auth(/|$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE external;
        }

        location ~ ^/api/v1/external/(?!execute(?:/|$)) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE external;
        }

        location ~ ^/api/v1/(governance/requests|reports)(/|$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE external;
        }

        location /api/ {
            default_type application/problem+json;
            return 403 '{"code":"DOORS-PLANE-ROUTE-DENIED","message":"Endpoint is not exposed on the external plane"}';
        }
    }

    # API PLANE: machine clients and Swagger only; no interactive portal.
    server {
        listen 443 ssl;
        server_name doorsapi.doors.test;

        ssl_certificate     C:/nginx/conf/certs/doors-cert.pem;
        ssl_certificate_key C:/nginx/conf/certs/doors-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /doors-swagger.html;
        }

        location ~ ^/api/v1/master/gateway(/|$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE api;
        }

        location ~ ^/api/v1/external/execute(/|$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE api;
        }

        location ~ ^/(v3/api-docs|swagger|doors-swagger|forge-1\.3\.2\.min\.js$) {
            proxy_pass http://doors_master_api;
            include conf/doors-proxy-common.conf;
            proxy_set_header X-DOORS-PLANE api;
        }

        location / {
            default_type application/problem+json;
            return 403 '{"code":"DOORS-API-PLANE-ONLY","message":"Interactive portal access is not available on the API plane"}';
        }
    }
}
